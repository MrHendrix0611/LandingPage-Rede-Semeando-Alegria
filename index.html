<audio id="bgMusic"></audio>
<script>

const music =
    document.getElementById("bgMusic");

const playlist = [
    "audio/musica1.mp3",
    "audio/musica2.mp3",
    "audio/musica3.mp3"
];

const MAX_VOLUME = 0.15;

let currentIndex =
    Math.floor(
        Math.random() *
        playlist.length
    );

music.src =
    playlist[currentIndex];

music.volume =
    MAX_VOLUME;

let musicaIniciada = false;

function iniciarMusica(){

    if(musicaIniciada)
        return;

    musicaIniciada = true;

    music.play()
        .then(()=>{

            console.log(
                "Música iniciada"
            );

        })
        .catch(err=>{

            console.log(err);

            musicaIniciada = false;

        });

}

/* desktop */
document.addEventListener(
    "mousemove",
    iniciarMusica
);

/* celular */
document.addEventListener(
    "touchmove",
    iniciarMusica
);

/* caso o usuário volte para a aba */
window.addEventListener(
    "pageshow",
    ()=>{

        musicaIniciada = false;

    }
);

/* ===========================
   Troca de músicas
=========================== */

function trocarMusica(){

    let volume =
        music.volume;

    const fadeOut =
        setInterval(() => {

            volume -= 0.02;

            if(volume < 0)
                volume = 0;

            music.volume =
                volume;

            if(volume <= 0){

                clearInterval(
                    fadeOut
                );

                let novo;

                do{

                    novo =
                        Math.floor(
                            Math.random()
                            * playlist.length
                        );

                }
                while(
                    novo === currentIndex
                    &&
                    playlist.length > 1
                );

                currentIndex =
                    novo;

                music.src =
                    playlist[currentIndex];

                music.play();

                let fade = 0;

                const fadeIn =
                    setInterval(() => {

                        fade += 0.02;

                        if(
                            fade >
                            MAX_VOLUME
                        ){
                            fade =
                                MAX_VOLUME;
                        }

                        music.volume =
                            fade;

                        if(
                            fade >=
                            MAX_VOLUME
                        ){

                            clearInterval(
                                fadeIn
                            );

                        }

                    },100);

            }

        },100);

}

music.addEventListener(
    "ended",
    trocarMusica
);

</script>

    <script>

    const avatar=document.getElementById("avatar");
    const colors = [
        "#FFD600",
        "#6B46FF",
        "#FF4F7B",
        "#A7D46F",
        "#FFFFFF"
    ];

    document.querySelectorAll(".particle-effect").forEach(element => {

        element.addEventListener("mousemove", e => {

            const rect = element.getBoundingClientRect();

            for(let i=0;i<3;i++){

                const p = document.createElement("span");

                p.className = "particle";

                p.style.background =
                    colors[Math.floor(Math.random()*colors.length)];

                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                p.style.left = x + "px";
                p.style.top = y + "px";

                p.style.setProperty(
                    "--x",
                    (Math.random()*140-70)+"px"
                );

                p.style.setProperty(
                    "--y",
                    (Math.random()*140-70)+"px"
                );

                const target =
                    element.classList.contains("avatar")
                        ? element.parentElement
                        : element;

                target.appendChild(p);

                setTimeout(()=>{
                    p.remove();
                },900);

            }

        });

    });

    </script>
